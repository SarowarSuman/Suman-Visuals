name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS -X POST "$SB_URL/storage/v1/object/list/media" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "apikey: $SB_KEY" \
            -H "Content-Type: application/json" \
            -d '{"limit":1}'

      - name: Keep repo active
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          date -u > .last-ping
          git add .last-ping
          git commit -m "chore: keep-alive ping" || true
          git push
